<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>图文混剪</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">图文混剪 MVP</div>
    <div class="actions">
      <button id="btn-add-images">+ 图片</button>
      <button id="btn-add-audio">+ 音频</button>
      <button id="btn-add-subtitle">+ 字幕</button>
      <button id="btn-script" class="primary-soft">📝 粘文案</button>
      <button id="btn-save">保存</button>
      <button id="btn-load">加载</button>
      <button id="btn-export" class="primary">导出 WebM</button>
    </div>
    <input type="file" id="file-images" accept="image/*" multiple hidden />
    <input type="file" id="file-audio" accept="audio/*" hidden />
    <input type="file" id="file-load" accept="application/json" hidden />
  </header>

  <main class="workspace">
    <section class="preview">
      <div class="canvas-wrap">
        <canvas id="stage" width="1280" height="720"></canvas>
      </div>
      <div class="transport">
        <button id="btn-play">▶ 播放</button>
        <button id="btn-stop">■ 停止</button>
        <input type="range" id="seek" min="0" max="0" step="0.01" value="0" />
        <span id="time-label">0.00 / 0.00</span>
      </div>
    </section>

    <aside class="inspector">
      <div class="inspector-title">属性</div>
      <div id="inspector-body" class="inspector-body">
        <p class="hint">在时间轴上选中片段或字幕来编辑。</p>
      </div>
    </aside>
  </main>

  <section class="timeline">
    <div class="track-labels">
      <div class="track-label">图片</div>
      <div class="track-label">字幕</div>
      <div class="track-label">音频</div>
    </div>
    <div class="track-area" id="track-area">
      <div class="ruler" id="ruler"></div>
      <div class="track" id="track-images"></div>
      <div class="track" id="track-subtitles"></div>
      <div class="track" id="track-audio"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">粘贴文案 · 一键对齐</div>
      <p class="hint">每一行 = 一张图片对应的一句文案。如果上传了音频，将均分音频时长；否则每行默认 3 秒。</p>
      <textarea id="script-text" placeholder="第一句解说...&#10;第二句解说...&#10;第三句解说..."></textarea>
      <div class="modal-row">
        <label>每行时长（秒，仅在没有音频时生效）</label>
        <input type="number" id="script-per-line" value="3" step="0.1" min="0.5" />
      </div>
      <div class="modal-row">
        <label><input type="checkbox" id="script-replace-clips" checked /> 让图片片段平均铺满总时长</label>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel">取消</button>
        <button id="modal-apply" class="primary">应用</button>
      </div>
    </div>
  </div>

  <div id="export-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div id="export-status">正在导出 0%</div>
      <div class="bar"><div id="export-bar"></div></div>
      <button id="export-cancel" class="danger">取消</button>
    </div>
  </div>

  <div id="dropzone" class="dropzone hidden">拖到这里：图片或音频</div>

  <script src="app.js"></script>
</body>
</html>
