<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>图文混剪</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">图文混剪 MVP</div>
    <div class="actions">
      <button id="btn-add-images">+ 图片</button>
      <button id="btn-add-audio">+ 音频</button>
      <button id="btn-add-subtitle">+ 字幕</button>
      <button id="btn-script" class="primary-soft">📝 粘文案</button>
      <button id="btn-auto-calibrate" class="primary-soft">🤖 自动校准</button>
      <button id="btn-calibrate" class="primary-soft">🎯 跟读校准</button>
      <button id="btn-save">保存</button>
      <button id="btn-load">加载</button>
      <button id="btn-export" class="primary">导出视频</button>
    </div>
    <input type="file" id="file-images" accept="image/*" multiple hidden />
    <input type="file" id="file-audio" accept="audio/*" hidden />
    <input type="file" id="file-load" accept="application/json" hidden />
  </header>

  <main class="workspace">
    <section class="preview">
      <div class="canvas-wrap">
        <canvas id="stage" width="1280" height="720"></canvas>
      </div>
      <div class="transport">
        <button id="btn-play">▶ 播放</button>
        <button id="btn-stop">■ 停止</button>
        <button id="btn-fullscreen">⛶ 全屏预览</button>
        <input type="range" id="seek" min="0" max="0" step="0.01" value="0" />
        <span id="time-label">0.00 / 0.00</span>
      </div>
    </section>

    <aside class="inspector">
      <div class="inspector-title">属性</div>
      <div id="inspector-body" class="inspector-body">
        <p class="hint">在时间轴上选中片段或字幕来编辑。</p>
      </div>
    </aside>
  </main>

  <section class="timeline">
    <div class="track-labels">
      <div class="track-label">图片</div>
      <div class="track-label">字幕</div>
      <div class="track-label">音频</div>
    </div>
    <div class="track-area" id="track-area">
      <div class="ruler" id="ruler"></div>
      <div class="track" id="track-images"></div>
      <div class="track" id="track-subtitles"></div>
      <div class="track" id="track-audio"></div>
      <div class="playhead" id="playhead"></div>
    </div>
  </section>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-title">文案对齐</div>

      <div class="tabs">
        <div class="tab active" data-tab="paste">粘贴文字</div>
        <div class="tab" data-tab="table">导入表格</div>
      </div>

      <div class="tab-panel" data-panel="paste">
        <p class="hint">每一行 = 一句字幕。系统会均分到音频时长（无音频则按"每行时长"）。</p>
        <textarea id="script-text" placeholder="第一句解说...&#10;第二句解说...&#10;第三句解说..."></textarea>
        <div class="modal-row">
          <label><input type="checkbox" id="script-auto-split" /> 整段粘贴时按标点自动切句（。！？；）</label>
        </div>
      </div>

      <div class="tab-panel hidden" data-panel="table">
        <p class="hint">支持 .csv / .xlsx / .xls。第一行视为表头，选择"文案列"即可。</p>
        <div class="modal-row">
          <input type="file" id="table-file" accept=".csv,.xlsx,.xls,.tsv" />
        </div>
        <div id="table-pick" class="hidden">
          <div class="modal-row">
            <label>文案列</label>
            <select id="table-col"></select>
          </div>
          <div id="table-preview" class="table-preview"></div>
        </div>
      </div>

      <div class="modal-row">
        <label>每行时长（秒，无音频时生效）</label>
        <input type="number" id="script-per-line" value="3" step="0.1" min="0.5" />
      </div>
      <div class="modal-row">
        <label><input type="checkbox" id="script-proportional" checked /> 按字数比例分配时长（推荐：长句更长）</label>
      </div>
      <div class="modal-row">
        <label><input type="checkbox" id="script-replace-clips" checked /> 图片翻页时长自动对齐字幕</label>
      </div>
      <div class="modal-actions">
        <button id="modal-cancel">取消</button>
        <button id="modal-apply" class="primary">应用</button>
      </div>
    </div>
  </div>

  <div id="export-overlay" class="overlay hidden">
    <div class="overlay-card">
      <div id="export-status">正在导出 0%</div>
      <div class="bar"><div id="export-bar"></div></div>
      <button id="export-cancel" class="danger">取消</button>
    </div>
  </div>

  <div id="dropzone" class="dropzone hidden">拖到这里：图片或音频</div>

  <div id="calibration" class="overlay hidden">
    <div class="overlay-card" style="width: 420px;">
      <div style="font-weight: 600;">🎯 跟读校准</div>
      <div id="cal-progress" style="color: var(--muted); font-size: 12px;">准备中...</div>
      <div id="cal-line" style="background: var(--panel-2); padding: 10px; border-radius: 4px; min-height: 40px;"></div>
      <p class="hint" style="margin: 0;">听到下一句开头时，按 <kbd>空格</kbd> 标记。<kbd>Esc</kbd> 取消。</p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="cal-cancel">取消</button>
        <button id="cal-finish" class="primary">完成</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
